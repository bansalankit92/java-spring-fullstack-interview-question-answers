<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#EDF1F7"/>
  <!-- stacked index cards -->
  <g transform="translate(760 120) rotate(8)">
    <rect width="340" height="230" rx="22" fill="#FFFFFF" stroke="#142033" stroke-width="3"/>
  </g>
  <g transform="translate(730 150) rotate(-5)">
    <rect width="360" height="250" rx="22" fill="#FFFFFF" stroke="#142033" stroke-width="3"/>
    <rect x="34" y="40" width="190" height="14" rx="4" fill="#2350D8"/>
    <text x="34" y="105" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700" fill="#142033">Saga pattern</text>
    <rect x="34" y="132" width="290" height="44" rx="8" fill="#FFE766"/>
    <text x="48" y="161" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#142033">Say this in the interview…</text>
    <rect x="34" y="196" width="230" height="10" rx="5" fill="#D2DAE7"/>
  </g>
  <!-- text -->
  <rect x="80" y="92" width="64" height="48" rx="9" fill="#FFFFFF" stroke="#142033" stroke-width="3" transform="rotate(-5 112 116)"/>
  <rect x="92" y="110" width="40" height="9" fill="#FFE766" transform="rotate(-5 112 116)"/>
  <text x="164" y="130" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="700" fill="#142033">Interview Prep 2026</text>
  <text x="80" y="250" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800" fill="#142033">Interview questions,</text>
  <text x="80" y="322" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800" fill="#2350D8">one card at a time</text>
  <text x="80" y="398" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#586780">System design · Microservices · Java · Spring Boot</text>
  <text x="80" y="438" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#586780">Kafka · React · AI and LLMs — in simple English</text>
  <rect x="80" y="490" width="430" height="60" rx="14" fill="#2350D8"/>
  <text x="104" y="529" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">interviewprep.ankitbansal.dev</text>
