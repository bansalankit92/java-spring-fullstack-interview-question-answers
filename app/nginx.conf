server {
  # 80 is the normal port. 3000 is Dokploy's default "Container Port" for domains, so either setting works.
  listen 80;
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

  # Cards change on every deploy: always check for a fresh copy.
  location /content/data.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location ~* \.webmanifest$ { default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /content/images/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

  location / { try_files $uri $uri/ /index.html; }
}
